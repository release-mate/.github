name: lint

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".github/workflows/lint.yml"
      - "mado.toml"
      - ".codespellrc"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".github/workflows/lint.yml"
      - "mado.toml"
      - ".codespellrc"
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    name: markdown (mado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: akiomik/mado@6642676268ddaad6187482ef57d95e218c6b865c # v0.3.2

  spelling:
    name: spelling (codespell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: codespell-project/actions-codespell@8f01853be192eb0f849a5c7d721450e7a467c579 # v2.2
        with:
          path: .
          check_filenames: true

  links:
    name: links (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --verbose --max-concurrency 4 './**/*.md'
          fail: true

  mermaid:
    name: mermaid render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sgerrand/mermaid-validation-action@31f8eed257dbbbadad3332c83694866903e92b0e # v0.2.0
